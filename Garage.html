<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Service Reminder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body { background: #eef1f6; padding: 12px; padding-bottom: 80px; }
.container { max-width: 520px; margin: auto; }
.box { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
h2 { color: #1a73e8; margin-bottom: 12px; }
input, select, textarea, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #ccd2dd; font-size: 15px; }
button { background: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; }
.btn-green { background: #25D366; }
.btn-orange { background: #ff6b00; }
.btn-red { background: #e53935; }
.btn-gray { background: #6b7280; }
.btn-sm { padding: 8px 12px; font-size: 13px; width: auto; margin: 4px 4px 0 0; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.card { background: #fafbfc; padding: 12px; border-radius: 10px; margin: 8px 0; border-left: 4px solid #1a73e8; }
.card.due { border-left-color: #e53935; background: #fff5f5; }
.card h4 { color: #111; margin-bottom: 6px; }
.card p { font-size: 13px; color: #555; margin: 3px 0; }
.hidden { display: none !important; }
.reminder { background: #fff3cd; border-left: 4px solid #ff9800; padding: 10px; border-radius: 8px; margin: 8px 0; }
.reminder.danger { background: #ffebee; border-left-color: #e53935; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; color: white; }
.badge.red { background: #e53935; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat { background: #1a73e8; color: white; padding: 12px; border-radius: 10px; text-align: center; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 11px; }
.stat.red { background: #e53935; }
.stat.green { background: #25D366; }
.empty { text-align: center; color: #999; padding: 30px 10px; }
.footer-actions { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 10px 12px; display: flex; gap: 8px; max-width: 520px; margin: auto; }
.footer-actions button { margin: 0; }
</style>
</head>
<body>
<div class="container">
  <div id="page1">
    <div class="box">
      <h2>🏍️ Garage Service Reminder</h2>
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><span>Total</span></div>
        <div class="stat red"><b id="statDue">0</b><span>Due</span></div>
        <div class="stat green"><b id="statMonth">0</b><span>Is Mahine</span></div>
      </div>
      <div id="reminders"></div>
      <input type="text" id="search" placeholder="🔍 Search karein..." oninput="renderCustomers()">
    </div>
    <div class="box">
      <h3>📋 Customer List</h3>
      <div id="customerList"></div>
    </div>
  </div>
  <div id="page2" class="hidden">
    <div class="box">
      <h2>➕ Naya Customer</h2>
      <input type="text" id="custName" placeholder="Customer ka naam">
      <input type="tel" id="custPhone" placeholder="Phone (10 digit)" maxlength="10">
      <div class="row">
        <button class="btn-green" onclick="saveCustomer()">Save & Next →</button>
        <button class="btn-gray" onclick="showPage('page1')">← Back</button>
      </div>
    </div>
  </div>
  <div id="page3" class="hidden">
    <div class="box">
      <h2>🏍️ Vehicle & Service</h2>
      <input type="text" id="vehNumber" placeholder="Vehicle Number">
      <select id="vehCompany" onchange="loadModels()"><option value="">-- Company chunein --</option></select>
      <select id="vehModel"><option value="">-- Model chunein --</option></select>
      <input type="number" id="currentKm" placeholder="Current Kilometer">
      <input type="date" id="serviceDate">
      <select id="serviceKm">
        <option value="700">700 km</option>
        <option value="1000">1000 km</option>
        <option value="1500">1500 km</option>
        <option value="2000" selected>2000 km</option>
        <option value="2500">2500 km</option>
        <option value="3000">3000 km</option>
        <option value="3500">3500 km</option>
      </select>
      <input type="number" id="billAmount" placeholder="Bill Amount ₹ (optional)">
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
      <div class="reminder" id="autoCalc"></div>
      <div class="row">
        <button class="btn-green" onclick="saveVehicle()">💾 Save & SMS</button>
        <button class="btn-gray" onclick="showPage('page1')">← Back</button>
      </div>
    </div>
  </div>
  <div id="page4" class="hidden">
    <div class="box">
      <h2>👤 Customer Detail</h2>
      <div id="custDetail"></div>
      <h3>📜 Service History</h3>
      <div id="serviceHistory"></div>
      <button class="btn-gray" onclick="showPage('page1')">← Back</button>
    </div>
  </div>
</div>
<div class="footer-actions">
  <button class="btn-green" onclick="showPage('page2')">➕ Add Customer</button>
  <button class="btn-orange" onclick="exportData()">📤 Backup</button>
  <button class="btn-gray" onclick="importData()">📥 Restore</button>
</div>
<input type="file" id="importFile" accept=".json" class="hidden" onchange="handleImport(event)">
<script>
var vehicleDB = {
  "Hero": ["Splendor Plus", "HF Deluxe", "Passion Pro", "Glamour", "Xtreme 160R", "Destini 125", "Xpulse 200"],
  "Honda": ["Activa 6G", "Activa 125", "Shine", "Unicorn", "SP 125", "Dio", "Hornet 2.0", "CB350"],
  "Bajaj": ["Pulsar 150", "Pulsar NS200", "Platina", "CT 100", "Avenger 220", "Chetak", "Dominar 400"],
  "TVS": ["Jupiter", "Ntorq 125", "Apache RTR 160", "Raider 125", "Sport", "XL100", "Ronin"],
  "Yamaha": ["FZ-S", "MT-15", "R15", "Fascino 125", "Ray ZR", "Aerox"],
  "Royal Enfield": ["Classic 350", "Bullet 350", "Hunter 350", "Meteor 350", "Himalayan"],
  "Suzuki": ["Access 125", "Burgman Street", "Gixxer", "Avenis"],
  "Ola": ["S1", "S1 Pro", "S1 Air"],
  "Ather": ["450X", "450 Plus", "Rizta"],
  "Jawa": ["Jawa 42", "Jawa Classic", "Perak"],
  "KTM": ["Duke 200", "Duke 390", "RC 200"],
  "Other": ["Custom Model"]
};

var currentCustomer = null;

window.onload = function() {
  loadCompanies();
  renderCustomers();
  checkReminders();
  updateStats();
};

function loadCompanies() {
  var sel = document.getElementById("vehCompany");
  for (var c in vehicleDB) {
    var opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  }
}

function loadModels() {
  var company = document.getElementById("vehCompany").value;
  var modelSel = document.getElementById("vehModel");
  modelSel.innerHTML = '<option value="">-- Model chunein --</option>';
  if (vehicleDB[company]) {
    vehicleDB[company].forEach(function(m) {
      var opt = document.createElement("option");
      opt.value = m; opt.textContent = m;
      modelSel.appendChild(opt);
    });
  }
}

document.addEventListener("input", function(e) {
  if (e.target.id === "currentKm" || e.target.id === "serviceKm") {
    var cur = parseInt(document.getElementById("currentKm").value) || 0;
    var interval = parseInt(document.getElementById("serviceKm").value) || 0;
    document.getElementById("autoCalc").innerHTML = "🔧 Agla service: <b>" + (cur + interval) + " km</b> par";
  }
});

function showPage(p) {
  ["page1","page2","page3","page4"].forEach(function(id) {
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(p).classList.remove("hidden");
  window.scrollTo(0,0);
}

function saveCustomer() {
  var name = document.getElementById("custName").value.trim();
  var phone = document.getElementById("custPhone").value.trim();
  if (!name) { alert("Naam daalein!"); return; }
  if (phone.length !== 10) { alert("10 digit phone number daalein!"); return; }
  currentCustomer = { name: name, phone: phone, id: Date.now() };
  document.getElementById("custName").value = "";
  document.getElementById("custPhone").value = "";
  showPage("page3");
}

function saveVehicle() {
  var vehNumber = document.getElementById("vehNumber").value.trim().toUpperCase();
  var company = document.getElementById("vehCompany").value;
  var model = document.getElementById("vehModel").value;
  var currentKm = parseInt(document.getElementById("currentKm").value) || 0;
  var serviceDate = document.getElementById("serviceDate").value;
  var serviceKm = parseInt(document.getElementById("serviceKm").value) || 0;
  var billAmount = document.getElementById("billAmount").value.trim();
  var notes = document.getElementById("notes").value.trim();

  if (!vehNumber || !company || !model || !currentKm || !serviceDate) {
    alert("Saari zaroori details bharein!");
    return;
  }

  var record = {
    name: currentCustomer.name, phone: currentCustomer.phone, id: currentCustomer.id,
    vehNumber: vehNumber, company: company, model: model,
    currentKm: currentKm, serviceDate: serviceDate, serviceKm: serviceKm,
    nextServiceKm: currentKm + serviceKm,
    billAmount: billAmount, notes: notes,
    createdAt: new Date().toISOString(), history: []
  };

  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  all.push(record);
  localStorage.setItem("garageCustomers", JSON.stringify(all));

  var smsMsg = "Namaste " + currentCustomer.name + " ji, aapki " + company + " " + model + " (" + vehNumber + ") ka service due hai. Date: " + serviceDate + ", Next: " + (currentKm + serviceKm) + " km. Kripya garage aayein.";
  sendSMS(currentCustomer.phone, smsMsg);

  ["vehNumber","currentKm","serviceDate","billAmount","notes"].forEach(function(id) {
    document.getElementById(id).value = "";
  });
  document.getElementById("vehCompany").value = "";
  document.getElementById("vehModel").innerHTML = '<option value="">-- Model chunein --</option>';
  document.getElementById("autoCalc").innerHTML = "";

  renderCustomers();
  updateStats();
  checkReminders();
  showPage("page1");
}

function sendSMS(phone, message) {
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  var sep = isIOS ? "&" : "?";
  window.location.href = "sms:+91" + phone + sep + "body=" + encodeURIComponent(message);
}

function renderCustomers() {
  var query = (document.getElementById("search").value || "").toLowerCase();
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var list = document.getElementById("customerList");
  list.innerHTML = "";

  var filtered = all.filter(function(c) {
    return c.name.toLowerCase().indexOf(query) > -1 ||
           c.vehNumber.toLowerCase().indexOf(query) > -1 ||
           c.phone.indexOf(query) > -1 ||
           c.company.toLowerCase().indexOf(query) > -1 ||
           c.model.toLowerCase().indexOf(query) > -1;
  });

  if (filtered.length === 0) {
    list.innerHTML = "<div class='empty'>Koi customer nahi mila.</div>";
    return;
  }

  var today = new Date().toISOString().split("T")[0];
  filtered.forEach(function(c) {
    var isDue = c.serviceDate <= today;
    var div = document.createElement("div");
    div.className = "card" + (isDue ? " due" : "");
    div.innerHTML = 
      "<h4>" + c.name + (isDue ? ' <span class="badge red">DUE</span>' : '') + "</h4>" +
      "<p>📞 " + c.phone + "</p>" +
      "<p>🏍️ " + c.company + " " + c.model + " — <b>" + c.vehNumber + "</b></p>" +
      "<p>📍 Current: " + c.currentKm + " km | 🔧 Next: <b>" + c.nextServiceKm + " km</b></p>" +
      "<p>📅 Service Date: " + c.serviceDate + "</p>" +
      (c.billAmount ? "<p>💰 Bill: ₹" + c.billAmount + "</p>" : "") +
      '<div style="margin-top:6px">' +
        '<button class="btn-sm btn-green" onclick="event.stopPropagation();whatsappCustomer(' + c.id + ')">💬 WhatsApp</button>' +
        '<button class="btn-sm btn-orange" onclick="event.stopPropagation();sendReminderSMS(' + c.id + ')">📱 SMS</button>' +
        '<button class="btn-sm" onclick="event.stopPropagation();viewCustomer(' + c.id + ')">👁️ View</button>' +
      '</div>';
    div.onclick = function() { viewCustomer(c.id); };
    list.appendChild(div);
  });
}

function updateStats() {
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var today = new Date().toISOString().split("T")[0];
  var thisMonth = today.substring(0, 7);
  document.getElementById("statTotal").textContent = all.length;
  document.getElementById("statDue").textContent = all.filter(function(c) { return c.serviceDate <= today; }).length;
  document.getElementById("statMonth").textContent = all.filter(function(c) { return c.serviceDate.indexOf(thisMonth) === 0; }).length;
}

function checkReminders() {
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var today = new Date().toISOString().split("T")[0];
  var box = document.getElementById("reminders");
  box.innerHTML = "";
  all.filter(function(c) { return c.serviceDate <= today; }).forEach(function(c) {
    box.innerHTML += '<div class="reminder danger">⚠️ <b>' + c.name + '</b> (' + c.vehNumber + ') ka service <b>' + c.serviceDate + '</b> ko due tha! ' +
      '<button class="btn-sm btn-green" onclick="whatsappCustomer(' + c.id + ')">WhatsApp</button>' +
      '<button class="btn-sm btn-orange" onclick="sendReminderSMS(' + c.id + ')">SMS</button></div>';
  });
}

function whatsappCustomer(id) {
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var c = all.find(function(x) { return x.id === id; });
  var msg = "Namaste " + c.name + " ji 🙏\nAapki " + c.company + " " + c.model + " (" + c.vehNumber + ") ka service due hai.\n📅 Date: " + c.serviceDate + "\n🔧 Next: " + c.nextServiceKm + " km";
  window.open("https://wa.me/91" + c.phone + "?text=" + encodeURIComponent(msg), "_blank");
}

function sendReminderSMS(id) {
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var c = all.find(function(x) { return x.id === id; });
  var msg = "Namaste " + c.name + " ji, aapki " + c.company + " " + c.model + " (" + c.vehNumber + ") ka service due hai.";
  sendSMS(c.phone, msg);
}

function viewCustomer(id) {
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var c = all.find(function(x) { return x.id === id; });
  if (!c) return;
  document.getElementById("custDetail").innerHTML = 
    '<div class="card">' +
      '<h4>' + c.name + '</h4>' +
      '<p>📞 ' + c.phone + '</p>' +
      '<p>🏍️ ' + c.company + ' ' + c.model + ' — <b>' + c.vehNumber + '</b></p>' +
      '<p>📍 Current KM: ' + c.currentKm + '</p>' +
      '<p>📅 Service Date: ' + c.serviceDate + '</p>' +
      '<p>➡️ Next Service: <b>' + c.nextServiceKm + ' km</b></p>' +
      (c.billAmount ? '<p>💰 Bill: ₹' + c.billAmount + '</p>' : '') +
      '<div style="margin-top:10px">' +
        '<button class="btn-sm btn-green" onclick="whatsappCustomer(' + c.id + ')">💬 WhatsApp</button>' +
        '<button class="btn-sm btn-orange" onclick="sendReminderSMS(' + c.id + ')">📱 SMS</button>' +
        '<button class="btn-sm" onclick="addService(' + c.id + ')">➕ New Service</button>' +
        '<button class="btn-sm btn-red" onclick="deleteCustomer(' + c.id + ')">🗑️ Delete</button>' +
      '</div></div>';

  var hist = document.getElementById("serviceHistory");
  if (!c.history || c.history.length === 0) {
    hist.innerHTML = "<div class='empty'>Abhi koi purani service nahi hai.</div>";
  } else {
    hist.innerHTML = c.history.map(function(h) {
      return '<div class="card"><p><b>' + h.date + '</b></p><p>KM: ' + h.km + ' | Bill: ₹' + (h.bill || 0) + '</p></div>';
    }).reverse().join("");
  }
  showPage("page4");
}

function addService(id) {
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  var c = all.find(function(x) { return x.id === id; });
  var km = prompt("Naya current KM daalein:");
  if (!km) return;
  var bill = prompt("Bill amount ₹:") || "0";
  var notes = prompt("Notes (optional):") || "";
  var date = new Date().toISOString().split("T")[0];
  if (!c.history) c.history = [];
  c.history.push({ date: date, km: parseInt(km), bill: bill, notes: notes });
  c.currentKm = parseInt(km);
  c.nextServiceKm = c.currentKm + c.serviceKm;
  c.billAmount = bill;
  localStorage.setItem("garageCustomers", JSON.stringify(all));
  viewCustomer(id);
  renderCustomers();
  updateStats();
  alert("Service record add ho gaya!");
}

function deleteCustomer(id) {
  if (!confirm("Pakka delete karein?")) return;
  var all = JSON.parse(localStorage.getItem("garageCustomers") || "[]");
  all = all.filter(function(x) { return x.id !== id; });
  localStorage.setItem("garageCustomers", JSON.stringify(all));
  renderCustomers();
  updateStats();
  checkReminders();
  showPage("page1");
}

function exportData() {
  var all = localStorage.getItem("garageCustomers") || "[]";
  var blob = new Blob([all], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "garage-backup-" + new Date().toISOString().split("T")[0] + ".json";
  a.click();
}

function importData() {
  document.getElementById("importFile").click();
}

function handleImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error("Invalid");
      if (!confirm(data.length + " customers mile. Purana data replace karein?")) return;
      localStorage.setItem("garageCustomers", JSON.stringify(data));
      renderCustomers();
      updateStats();
      checkReminders();
      alert("Restore ho gaya!");
    } catch (err) {
      alert("File sahi nahi hai!");
    }
  };
  reader.readAsText(file);
}
</script>
</body>
</html>
